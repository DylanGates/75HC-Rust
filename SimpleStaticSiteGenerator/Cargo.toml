[package]
name = "simple-static-site-generator"
version = "0.1.0"
edition = "2021"
description = "Converts Markdown files into HTML pages"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.11"
notify = { version = "6", features = ["macos_kqueue"] }
