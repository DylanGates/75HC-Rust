version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: book_library_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: book_library
    volumes:
      - mongodb_data:/data/db
    networks:
      - book_library_network

  redis:
    image: redis:7-alpine
    container_name: book_library_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - book_library_network

  book_library_backend:
    build: .
    container_name: book_library_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/book_library?authSource=admin
      - MONGODB_DATABASE=book_library
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=book_library=debug,tower_http=debug
    depends_on:
      - mongodb
      - redis
    networks:
      - book_library_network
    volumes:
      - ./.env:/app/.env:ro

volumes:
  mongodb_data:
  redis_data:

networks:
  book_library_network:
    driver: bridge