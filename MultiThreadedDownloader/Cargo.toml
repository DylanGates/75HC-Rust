[package]
name = "multi-threaded-downloader"
version = "0.1.0"
edition = "2021"
description = "Downloads a file in multiple concurrent parts using HTTP Range headers"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
indicatif = "0.17"
