[package]
name = "url_shortener"
version = "0.1.0"
edition = "2024"

[dependencies]

# HTTP server
actix-web = "4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random short id
rand = "0.8"

# Simple CLI parsing
clap = { version = "4", features = ["derive"] }

# Logging
env_logger = "0.10"
log = "0.4"

# For convenient error handling
anyhow = "1.0"
