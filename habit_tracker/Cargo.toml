[package]
name = "habit_tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }  # Added "env" feature
colored = "2.0"
comfy-table = "7.0"
dialoguer = "0.11"
dirs = "5.0"         
anyhow = "1.0"       
